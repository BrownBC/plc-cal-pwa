<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLC Calc">
<meta name="theme-color" content="#000000">
<title>PLC Calc</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--surface:#111;--card:#1a1a1a;--input-bg:#0a0a0a;
  --text:#f0f0f0;--text-dim:#888;--accent:#ccc;--accent2:#aaa;--border:#2a2a2a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Hiragino Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
body{
  display:flex;flex-direction:column;
  padding-top:var(--safe-top);
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
}

/* ===== Content ===== */
.tab-content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 8px 2px;
  display:flex;flex-direction:column;
}
.tab-page{display:none}
.tab-page.active{display:flex;flex-direction:column;margin-top:auto}

/* ===== Pill rows (no card wrapper) ===== */
.pill-row{display:flex;gap:4px;margin-bottom:3px;padding:0 2px}
.pill-row label{
  flex:1;min-width:0;text-align:center;
  padding:6px 2px;font-size:11px;font-weight:600;
  border-radius:6px;background:var(--input-bg);
  border:1.5px solid var(--border);color:var(--text-dim);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.pill-row input{display:none}
.pill-row label.selected{
  background:var(--card);border-color:var(--accent);color:var(--text);
}

/* ===== Section card ===== */
.section{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:7px 8px;margin-bottom:3px;
}
.section-title{
  font-size:12px;color:var(--accent);font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;
}

/* ===== Input ===== */
.calc-input{
  width:100%;background:var(--input-bg);
  border:1.5px solid var(--border);border-radius:7px;
  padding:8px 10px;font-size:18px;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  color:var(--text);outline:none;transition:border-color .2s;
}
.calc-input:focus,.calc-input.input-active{border-color:var(--accent)}
.calc-input::placeholder{color:var(--text-dim);opacity:.4}

/* ===== History ===== */
.history-box{
  margin-top:4px;background:var(--bg);border-radius:5px;
  padding:4px 6px;max-height:52px;overflow-y:auto;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:14px;color:var(--text-dim);line-height:1.4;
}
.history-box:empty::before{content:'計算履歴';color:var(--text-dim);opacity:.3}

/* ===== Result Table ===== */
.result-table{width:100%}
.result-row{
  display:flex;align-items:baseline;padding:2px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.result-row:last-child{border-bottom:none}
.result-label{
  width:76px;flex-shrink:0;font-size:13px;
  font-weight:700;color:var(--accent2);
}
.result-value{
  flex:1;font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:16px;color:var(--text);word-break:break-all;
  min-height:1em;user-select:all;-webkit-user-select:all;
}

/* ===== 2-Word Tab ===== */
.split-inputs{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.split-inputs .field{flex:1}
.split-inputs .field>label{
  display:block;font-size:10px;color:var(--text-dim);
  margin-bottom:2px;font-weight:600;
}
.split-input{
  width:100%;background:var(--input-bg);
  border:1.5px solid var(--border);border-radius:7px;
  padding:7px 8px;font-size:16px;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  color:var(--text);outline:none;transition:border-color .2s;
}
.split-input:focus,.split-input.input-active{border-color:var(--accent)}
.split-inputs .plus{font-size:16px;color:var(--text-dim);padding-top:12px}
.combine-btn{
  width:100%;padding:8px;border:none;border-radius:7px;
  background:#333;color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;transition:opacity .15s;
}
.combine-btn:active{opacity:.7}

/* ===== KEYPAD ===== */
.keypad{
  flex-shrink:0;display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;padding:3px 8px 4px;
  background:var(--bg);border-top:1px solid var(--border);
}
.key{
  height:48px;border:none;border-radius:7px;
  font-size:20px;font-weight:600;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  cursor:pointer;transition:background .1s;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;
}
.key:active{transform:scale(.95)}
.key-digit{background:#222;color:var(--text)}
.key-digit:active{background:#444}
.key-op{background:#1c1c1c;color:#bbb}
.key-op:active{background:#3a3a3a}
.key-func{background:#181818;color:#999}
.key-func:active{background:#333}
.key-eq{background:#444;color:#fff}
.key-eq:active{background:#666}
.key-zero{grid-column:span 2}
.key:disabled{opacity:.12;pointer-events:none;transform:none}

/* ===== Tab Bar ===== */
.tab-bar{
  display:flex;flex-shrink:0;background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:44px;background:none;border:none;
  color:var(--text-dim);font-size:10px;cursor:pointer;
  transition:color .2s;-webkit-tap-highlight-color:transparent;
}
.tab-btn.active{color:var(--text)}
.tab-btn svg{width:20px;height:20px;margin-bottom:1px;fill:currentColor}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="tab-content">

  <!-- ===== TAB 1 ===== -->
  <div id="page-calc" class="tab-page active">
    <div class="pill-row" id="rg-bitmode">
      <label class="selected" data-val="16"><input type="radio" name="bitmode" value="16" checked><span>WORD</span></label>
      <label data-val="32"><input type="radio" name="bitmode" value="32"><span>DWORD</span></label>
      <label data-val="64"><input type="radio" name="bitmode" value="64"><span>QWORD</span></label>
      <label data-val="0"><input type="radio" name="bitmode" value="0"><span>制限無し</span></label>
    </div>
    <div class="pill-row" id="rg-base">
      <label data-val="16"><input type="radio" name="base" value="16"><span>HEX</span></label>
      <label class="selected" data-val="10"><input type="radio" name="base" value="10" checked><span>DEC</span></label>
      <label data-val="8"><input type="radio" name="base" value="8"><span>OCT</span></label>
      <label data-val="2"><input type="radio" name="base" value="2"><span>BIN</span></label>
    </div>
    <div class="section">
      <input type="text" id="calcInput" class="calc-input input-active" placeholder="0" inputmode="none" readonly autocomplete="off">
      <div id="history" class="history-box"></div>
    </div>
    <div class="section">
      <div class="section-title">変換結果</div>
      <div class="result-table" id="results1">
        <div class="result-row"><span class="result-label">Unsigned</span><span class="result-value" id="r1-udec"></span></div>
        <div class="result-row"><span class="result-label">Signed</span><span class="result-value" id="r1-sdec"></span></div>
        <div class="result-row"><span class="result-label">HEX</span><span class="result-value" id="r1-hex"></span></div>
        <div class="result-row"><span class="result-label">BINARY</span><span class="result-value" id="r1-bin"></span></div>
        <div class="result-row"><span class="result-label">OCTAL</span><span class="result-value" id="r1-oct"></span></div>
        <div class="result-row"><span class="result-label">ASCII</span><span class="result-value" id="r1-ascii"></span></div>
      </div>
    </div>
  </div>

  <!-- ===== TAB 2 ===== -->
  <div id="page-split" class="tab-page">
    <div class="pill-row" id="rg-splitbase">
      <label data-val="16"><input type="radio" name="splitbase" value="16"><span>HEX</span></label>
      <label class="selected" data-val="10"><input type="radio" name="splitbase" value="10" checked><span>DEC</span></label>
      <label data-val="8"><input type="radio" name="splitbase" value="8"><span>OCT</span></label>
      <label data-val="2"><input type="radio" name="splitbase" value="2"><span>BIN</span></label>
    </div>
    <div class="section">
      <div class="section-title">2ワード合成</div>
      <div class="split-inputs">
        <div class="field">
          <label>上位 (D+1)</label>
          <input type="text" id="highWord" class="split-input input-active" placeholder="0" inputmode="none" readonly autocomplete="off">
        </div>
        <div class="plus">+</div>
        <div class="field">
          <label>下位 (D)</label>
          <input type="text" id="lowWord" class="split-input" placeholder="0" inputmode="none" readonly autocomplete="off">
        </div>
      </div>
      <button id="combineBtn" class="combine-btn">合成して変換</button>
    </div>
    <div class="section">
      <div class="section-title">合成結果 (DWORD)</div>
      <div class="result-table" id="results2">
        <div class="result-row"><span class="result-label">Unsigned</span><span class="result-value" id="r2-udec"></span></div>
        <div class="result-row"><span class="result-label">Signed</span><span class="result-value" id="r2-sdec"></span></div>
        <div class="result-row"><span class="result-label">HEX</span><span class="result-value" id="r2-hex"></span></div>
        <div class="result-row"><span class="result-label">BINARY</span><span class="result-value" id="r2-bin"></span></div>
        <div class="result-row"><span class="result-label">OCTAL</span><span class="result-value" id="r2-oct"></span></div>
        <div class="result-row"><span class="result-label">ASCII</span><span class="result-value" id="r2-ascii"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== KEYPAD ===== -->
<div class="keypad" id="keypad">
  <button class="key key-digit" data-key="A" data-min="16">A</button>
  <button class="key key-digit" data-key="B" data-min="16">B</button>
  <button class="key key-digit" data-key="C" data-min="16">C</button>
  <button class="key key-func"  data-key="AC">AC</button>

  <button class="key key-digit" data-key="D" data-min="16">D</button>
  <button class="key key-digit" data-key="E" data-min="16">E</button>
  <button class="key key-digit" data-key="F" data-min="16">F</button>
  <button class="key key-func"  data-key="BS">&larr;</button>

  <button class="key key-digit" data-key="7" data-min="8">7</button>
  <button class="key key-digit" data-key="8" data-min="10">8</button>
  <button class="key key-digit" data-key="9" data-min="10">9</button>
  <button class="key key-op"    data-key="/">&divide;</button>

  <button class="key key-digit" data-key="4" data-min="8">4</button>
  <button class="key key-digit" data-key="5" data-min="8">5</button>
  <button class="key key-digit" data-key="6" data-min="8">6</button>
  <button class="key key-op"    data-key="*">&times;</button>

  <button class="key key-digit" data-key="1" data-min="2">1</button>
  <button class="key key-digit" data-key="2" data-min="8">2</button>
  <button class="key key-digit" data-key="3" data-min="8">3</button>
  <button class="key key-op"    data-key="-">&minus;</button>

  <button class="key key-digit key-zero" data-key="0" data-min="2">0</button>
  <button class="key key-eq"    data-key="=">=</button>
  <button class="key key-op"    data-key="+">+</button>
</div>

<!-- ===== TAB BAR ===== -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="page-calc">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm-1 14H7v-1c0-.37.12-.7.34-1 .69-.93 2.88-1.5 3.66-1.5s2.97.57 3.66 1.5c.22.3.34.63.34 1v1h-4zM18 17h-3v-2h3v2zm0-4h-3v-2h3v2zm0-4h-3V7h3v2z"/></svg>
    <span>標準入力</span>
  </button>
  <button class="tab-btn" data-tab="page-split">
    <svg viewBox="0 0 24 24"><path d="M4 6h7V4H4c-1.1 0-2 .9-2 2v7h2V6zm16-2h-7v2h7v7h2V6c0-1.1-.9-2-2-2zM4 18c0 1.1.9 2 2 2h5v-2H6v-5H4v5zm16 0v-5h-2v5h-5v2h5c1.1 0 2-.9 2-2z"/></svg>
    <span>2ワード合成</span>
  </button>
</div>

<script>
(function(){
'use strict';

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function bigAbs(v){ return v < 0n ? -v : v; }

let bitMode=16, inputBase=10, splitBase=10, currentValue=0n;
let currentTab='page-calc', activeInput=null, activeSplitInput=null;

const calcInput=$('#calcInput'), historyEl=$('#history');
const highWordEl=$('#highWord'), lowWordEl=$('#lowWord');
activeInput=calcInput; activeSplitInput=highWordEl;

function setActiveInput(el){
  $$('.input-active').forEach(e=>e.classList.remove('input-active'));
  activeInput=el; el.classList.add('input-active');
}
[highWordEl,lowWordEl].forEach(el=>{
  el.addEventListener('click',()=>{
    activeSplitInput=el;
    if(currentTab==='page-split') setActiveInput(el);
  });
});

// Tabs
$$('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    $$('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    $$('.tab-page').forEach(p=>p.classList.remove('active'));
    const t=btn.dataset.tab; $('#'+t).classList.add('active');
    currentTab=t;
    setActiveInput(t==='page-calc'?calcInput:activeSplitInput);
    updateKeypad();
  });
});

// Radio pills
function setupPills(id,onChange){
  const g=$('#'+id);
  g.querySelectorAll('label').forEach(l=>{
    l.addEventListener('click',()=>{
      g.querySelectorAll('label').forEach(x=>x.classList.remove('selected'));
      l.classList.add('selected');
      l.querySelector('input').checked=true;
      onChange(parseInt(l.dataset.val,10));
    });
  });
}
setupPills('rg-bitmode',v=>{bitMode=v;updateResults('r1',currentValue,bitMode);updateInputDisplay()});
setupPills('rg-base',v=>{inputBase=v;updateInputDisplay();updateKeypad()});
setupPills('rg-splitbase',v=>{splitBase=v;updateKeypad()});

// Keypad state
function getActiveBase(){return currentTab==='page-calc'?inputBase:splitBase}
function updateKeypad(){
  const b=getActiveBase();
  $$('.key[data-min]').forEach(k=>{k.disabled=b<parseInt(k.dataset.min,10)});
}
updateKeypad();

// Keypad
$('#keypad').addEventListener('click',e=>{
  const btn=e.target.closest('.key');
  if(!btn||btn.disabled)return;
  const k=btn.dataset.key;
  if(navigator.vibrate)navigator.vibrate(10);
  if(k==='AC'){
    activeInput.value='';
    if(currentTab==='page-calc'){currentValue=0n;clearResults('r1')}
    else combineTwoWords();
    return;
  }
  if(k==='BS'){activeInput.value=activeInput.value.slice(0,-1);triggerUpdate();return}
  if(k==='='){
    if(currentTab==='page-calc')calculateExpression();
    else combineTwoWords();
    return;
  }
  activeInput.value+=k;
  triggerUpdate();
});

function triggerUpdate(){
  if(currentTab==='page-calc'){
    const r=calcInput.value.trim();
    if(!r){currentValue=0n;clearResults('r1');return}
    try{const v=parseValue(r,inputBase);if(v!==null){currentValue=v;updateResults('r1',v,bitMode)}}catch(e){}
  }else combineTwoWords();
}

function updateInputDisplay(){
  if(currentValue===null)return;
  let v=currentValue;
  if(bitMode>0)v=v&((1n<<BigInt(bitMode))-1n);
  calcInput.value=formatForBase(v,inputBase,bitMode);
}
function formatForBase(v,b,m){
  if(v<0n&&m===0){
    switch(b){case 16:return'-'+(-v).toString(16).toUpperCase();case 8:return'-'+(-v).toString(8);case 2:return'-'+(-v).toString(2);default:return v.toString(10)}
  }
  switch(b){case 16:return v.toString(16).toUpperCase();case 8:return v.toString(8);case 2:return v.toString(2);default:return v.toString(10)}
}
function parseValue(s,b){
  s=s.trim();if(!s)return null;
  if(/^0x/i.test(s))return BigInt('0x'+s.slice(2));
  if(/^0o/i.test(s))return BigInt('0o'+s.slice(2));
  if(/^0b/i.test(s))return BigInt('0b'+s.slice(2));
  let n=false;if(s.startsWith('-')){n=true;s=s.slice(1)}
  let v;
  switch(b){case 16:v=BigInt('0x'+s);break;case 8:v=BigInt('0o'+s);break;case 2:v=BigInt('0b'+s);break;default:v=BigInt(s)}
  return n?-v:v;
}

function calculateExpression(){
  const raw=calcInput.value.trim();
  if(!raw)return;
  if(!/[+\-*/%&|^~<>]/.test(raw)&&!/<<|>>/.test(raw))return;
  const base=inputBase;
  try{
    const expr=raw.replace(/\b([0-9a-fA-F]+)\b/g,(m)=>{
      if(/^0[xXoObB]/.test(m))return m+'n';
      try{const p={16:'0x',8:'0o',2:'0b'}[base]||'';BigInt(p+m);return p+m+'n'}catch(e){return m}
    });
    const e2=expr.replace(/\b(0[xX][0-9a-fA-F]+|0[oO][0-7]+|0[bB][01]+)(?!n)\b/g,'$1n');
    if(/[;(){}\[\]"'`\\$@!?]/.test(e2))throw new Error('Invalid');
    const r=Function('"use strict"; return ('+e2+')')();
    if(typeof r==='bigint'){
      currentValue=r;
      const rs=formatForBase(applyMask(r,bitMode),base,bitMode);
      addHistory(raw+' = '+rs);
      calcInput.value=rs;
      updateResults('r1',r,bitMode);
    }
  }catch(e){addHistory('Error: '+raw)}
}
function applyMask(v,m){return m>0?v&((1n<<BigInt(m))-1n):v}
function addHistory(t){
  const d=document.createElement('div');d.textContent=t;
  historyEl.appendChild(d);historyEl.scrollTop=historyEl.scrollHeight;
}

function updateResults(pfx,val,mode){
  let u,s,bits;
  if(mode>0){
    const mask=(1n<<BigInt(mode))-1n;bits=mode;u=val&mask;
    s=(u&(1n<<BigInt(bits-1)))?u-(1n<<BigInt(bits)):u;
  }else{u=val;s=val;bits=0}
  $('#'+pfx+'-udec').textContent=u.toString(10);
  $('#'+pfx+'-sdec').textContent=s.toString(10);
  // HEX
  if(bits>0){let h=u.toString(16).toUpperCase();$('#'+pfx+'-hex').textContent=h.padStart(bits/4,'0')}
  else $('#'+pfx+'-hex').textContent=val<0n?'-'+(-val).toString(16).toUpperCase():val.toString(16).toUpperCase();
  // BIN
  let bin=bits>0?u.toString(2).padStart(bits,'0'):(val<0n?'-'+(-val).toString(2):val.toString(2));
  const neg=bin.startsWith('-'),rb=neg?bin.slice(1):bin,ch=[];
  for(let i=rb.length;i>0;i-=4)ch.unshift(rb.slice(Math.max(0,i-4),i));
  let fb=ch.join(' ');if(neg)fb='-'+fb;
  $('#'+pfx+'-bin').textContent=fb;
  // OCT
  if(bits>0)$('#'+pfx+'-oct').textContent=u.toString(8);
  else $('#'+pfx+'-oct').textContent=val<0n?'-'+(-val).toString(8):val.toString(8);
  // ASCII
  try{
    const tgt=bits>0?u:bigAbs(val);
    let bl=bits>0?bits/8:Math.max(1,Math.ceil(bitLen(tgt)/8));
    if(bl>32)bl=32;let a='';
    for(let i=bl-1;i>=0;i--){const b=Number((tgt>>BigInt(i*8))&0xFFn);a+=(b>=0x20&&b<=0x7E)?String.fromCharCode(b):'.'}
    $('#'+pfx+'-ascii').textContent='['+a+']';
  }catch(e){$('#'+pfx+'-ascii').textContent=''}
}
function bitLen(v){if(v===0n)return 1;let n=0,x=v<0n?-v:v;while(x>0n){x>>=1n;n++}return n}
function clearResults(p){['udec','sdec','hex','bin','oct','ascii'].forEach(k=>$('#'+p+'-'+k).textContent='')}

// 2-Word
$('#combineBtn').addEventListener('click',combineTwoWords);
function combineTwoWords(){
  try{
    let h=parseValue(highWordEl.value.trim()||'0',splitBase);
    let l=parseValue(lowWordEl.value.trim()||'0',splitBase);
    if(h===null)h=0n;if(l===null)l=0n;
    h=h&0xFFFFn;l=l&0xFFFFn;
    updateResults('r2',(h<<16n)|l,32);
  }catch(e){clearResults('r2')}
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
