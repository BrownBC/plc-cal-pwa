<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLC Calc">
<meta name="theme-color" content="#000000">
<title>PLC Calc</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;
  --surface:#111111;
  --card:#1a1a1a;
  --input-bg:#0a0a0a;
  --text:#f0f0f0;
  --text-dim:#888888;
  --accent:#cccccc;
  --accent2:#aaaaaa;
  --green:#999999;
  --orange:#bbbbbb;
  --border:#2a2a2a;
  --tab-h:56px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Hiragino Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
body{
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-top);
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
}

/* ===== Header ===== */
.header{
  text-align:center;
  padding:10px 16px 6px;
  font-size:15px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:.5px;
  flex-shrink:0;
}

/* ===== Tab Content ===== */
.tab-content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 12px 12px;
}
.tab-page{display:none}
.tab-page.active{display:block}

/* ===== Bottom Tab Bar ===== */
.tab-bar{
  display:flex;
  flex-shrink:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
}
.tab-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:var(--tab-h);
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:10px;
  cursor:pointer;
  transition:color .2s;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:24px;height:24px;margin-bottom:2px;fill:currentColor}

/* ===== Section / Card ===== */
.section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.section-title{
  font-size:11px;
  color:var(--accent);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  margin-bottom:8px;
}

/* ===== Radio Group (pill style) ===== */
.radio-group{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
}
.radio-group label{
  flex:1;
  min-width:0;
  text-align:center;
  padding:8px 4px;
  font-size:12px;
  font-weight:600;
  border-radius:8px;
  background:var(--input-bg);
  border:1.5px solid var(--border);
  color:var(--text-dim);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.radio-group input{display:none}
.radio-group input:checked+span{
  /* handled via parent label */
}
.radio-group label.selected{
  background:var(--card);
  border-color:var(--accent);
  color:var(--accent);
}

/* ===== Input ===== */
.calc-input{
  width:100%;
  background:var(--input-bg);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:12px 14px;
  font-size:20px;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  color:var(--text);
  caret-color:var(--accent);
  outline:none;
  transition:border-color .2s;
}
.calc-input:focus{border-color:var(--accent)}
.calc-input::placeholder{color:var(--text-dim);opacity:.5}

/* ===== History ===== */
.history-box{
  background:var(--bg);
  border-radius:8px;
  padding:8px 10px;
  max-height:100px;
  overflow-y:auto;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:12px;
  color:var(--text-dim);
  line-height:1.6;
}
.history-box:empty::before{
  content:'計算履歴がここに表示されます';
  color:var(--text-dim);
  opacity:.4;
}

/* ===== Result Table ===== */
.result-table{width:100%}
.result-row{
  display:flex;
  align-items:baseline;
  padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.result-row:last-child{border-bottom:none}
.result-label{
  width:90px;
  flex-shrink:0;
  font-size:11px;
  font-weight:700;
  color:var(--accent2);
}
.result-value{
  flex:1;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:14px;
  color:var(--text);
  word-break:break-all;
  min-height:1.2em;
  user-select:all;
  -webkit-user-select:all;
}

/* ===== 2-Word Tab ===== */
.split-inputs{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}
.split-inputs .field{flex:1}
.split-inputs .field label{
  display:block;
  font-size:11px;
  color:var(--text-dim);
  margin-bottom:4px;
  font-weight:600;
}
.split-inputs .plus{
  font-size:22px;
  color:var(--text-dim);
  padding-top:16px;
}
.split-input{
  width:100%;
  background:var(--input-bg);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  font-size:18px;
  font-family:'SF Mono',Menlo,Consolas,monospace;
  color:var(--text);
  caret-color:var(--accent);
  outline:none;
  transition:border-color .2s;
}
.split-input:focus{border-color:var(--accent)}

.combine-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#555555,#333333);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:opacity .15s;
  margin-bottom:10px;
}
.combine-btn:active{opacity:.7}

/* ===== Utilities ===== */
.mb-8{margin-bottom:8px}

/* ===== Scrollbar (WebKit) ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">PLC Programmer's Calc</div>

<!-- Tab Pages -->
<div class="tab-content">

  <!-- ===== TAB 1: Standard Input ===== -->
  <div id="page-calc" class="tab-page active">

    <!-- Data Size -->
    <div class="section">
      <div class="section-title">データサイズ</div>
      <div class="radio-group" id="rg-bitmode">
        <label class="selected" data-val="16"><input type="radio" name="bitmode" value="16" checked><span>WORD(16)</span></label>
        <label data-val="32"><input type="radio" name="bitmode" value="32"><span>DWORD(32)</span></label>
        <label data-val="64"><input type="radio" name="bitmode" value="64"><span>QWORD(64)</span></label>
        <label data-val="0"><input type="radio" name="bitmode" value="0"><span>制限無し</span></label>
      </div>
    </div>

    <!-- Input Base -->
    <div class="section">
      <div class="section-title">入力基数</div>
      <div class="radio-group" id="rg-base">
        <label data-val="16"><input type="radio" name="base" value="16"><span>HEX</span></label>
        <label class="selected" data-val="10"><input type="radio" name="base" value="10" checked><span>DEC</span></label>
        <label data-val="8"><input type="radio" name="base" value="8"><span>OCT</span></label>
        <label data-val="2"><input type="radio" name="base" value="2"><span>BIN</span></label>
      </div>
    </div>

    <!-- Input Field -->
    <div class="section">
      <div class="section-title">入力 / 計算式</div>
      <input type="text" id="calcInput" class="calc-input mb-8" placeholder="値または式を入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
      <div class="section-title" style="margin-top:4px">計算履歴</div>
      <div id="history" class="history-box"></div>
    </div>

    <!-- Results -->
    <div class="section">
      <div class="section-title">変換結果</div>
      <div class="result-table" id="results1">
        <div class="result-row"><span class="result-label">Unsigned</span><span class="result-value" id="r1-udec"></span></div>
        <div class="result-row"><span class="result-label">Signed</span><span class="result-value" id="r1-sdec"></span></div>
        <div class="result-row"><span class="result-label">HEX</span><span class="result-value" id="r1-hex"></span></div>
        <div class="result-row"><span class="result-label">BINARY</span><span class="result-value" id="r1-bin"></span></div>
        <div class="result-row"><span class="result-label">OCTAL</span><span class="result-value" id="r1-oct"></span></div>
        <div class="result-row"><span class="result-label">ASCII</span><span class="result-value" id="r1-ascii"></span></div>
      </div>
    </div>
  </div>

  <!-- ===== TAB 2: 2-Word Combine ===== -->
  <div id="page-split" class="tab-page">

    <!-- Split Input Base -->
    <div class="section">
      <div class="section-title">入力基数</div>
      <div class="radio-group" id="rg-splitbase">
        <label data-val="16"><input type="radio" name="splitbase" value="16"><span>HEX</span></label>
        <label class="selected" data-val="10"><input type="radio" name="splitbase" value="10" checked><span>DEC</span></label>
        <label data-val="8"><input type="radio" name="splitbase" value="8"><span>OCT</span></label>
        <label data-val="2"><input type="radio" name="splitbase" value="2"><span>BIN</span></label>
      </div>
    </div>

    <!-- High / Low Word -->
    <div class="section">
      <div class="section-title">2ワード合成</div>
      <div class="split-inputs">
        <div class="field">
          <label>上位 (D+1)</label>
          <input type="text" id="highWord" class="split-input" placeholder="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
        </div>
        <div class="plus">+</div>
        <div class="field">
          <label>下位 (D)</label>
          <input type="text" id="lowWord" class="split-input" placeholder="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
        </div>
      </div>
      <button id="combineBtn" class="combine-btn">合成して変換</button>
    </div>

    <!-- Results -->
    <div class="section">
      <div class="section-title">合成結果 (DWORD)</div>
      <div class="result-table" id="results2">
        <div class="result-row"><span class="result-label">Unsigned</span><span class="result-value" id="r2-udec"></span></div>
        <div class="result-row"><span class="result-label">Signed</span><span class="result-value" id="r2-sdec"></span></div>
        <div class="result-row"><span class="result-label">HEX</span><span class="result-value" id="r2-hex"></span></div>
        <div class="result-row"><span class="result-label">BINARY</span><span class="result-value" id="r2-bin"></span></div>
        <div class="result-row"><span class="result-label">OCTAL</span><span class="result-value" id="r2-oct"></span></div>
        <div class="result-row"><span class="result-label">ASCII</span><span class="result-value" id="r2-ascii"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="page-calc">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm-1 14H7v-1c0-.37.12-.7.34-1 .69-.93 2.88-1.5 3.66-1.5s2.97.57 3.66 1.5c.22.3.34.63.34 1v1h-4zM18 17h-3v-2h3v2zm0-4h-3v-2h3v2zm0-4h-3V7h3v2z"/></svg>
    <span>標準入力</span>
  </button>
  <button class="tab-btn" data-tab="page-split">
    <svg viewBox="0 0 24 24"><path d="M4 6h7V4H4c-1.1 0-2 .9-2 2v7h2V6zm16-2h-7v2h7v7h2V6c0-1.1-.9-2-2-2zM4 18c0 1.1.9 2 2 2h5v-2H6v-5H4v5zm16 0v-5h-2v5h-5v2h5c1.1 0 2-.9 2-2z"/></svg>
    <span>2ワード合成</span>
  </button>
</div>

<script>
/* ============================================================
   PLC Programmer's Calc  — PWA Logic
   ============================================================ */
(function(){
'use strict';

// ── Helpers ──
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// BigInt-safe abs
function bigAbs(v){ return v < 0n ? -v : v; }

// ── State ──
let bitMode   = 16;
let inputBase = 10;
let splitBase = 10;
let currentValue = 0n; // use BigInt for 64bit support

// ── DOM refs ──
const calcInput = $('#calcInput');
const historyEl = $('#history');

// ── Tab switching ──
$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $$('.tab-page').forEach(p => p.classList.remove('active'));
    $('#' + btn.dataset.tab).classList.add('active');
  });
});

// ── Radio group helper ──
function setupRadioGroup(groupId, onChange){
  const group = $('#' + groupId);
  group.querySelectorAll('label').forEach(label => {
    label.addEventListener('click', () => {
      group.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      label.querySelector('input').checked = true;
      onChange(parseInt(label.dataset.val, 10));
    });
  });
}

setupRadioGroup('rg-bitmode', v => {
  bitMode = v;
  // Re-display with new bit mode
  updateResults('r1', currentValue, bitMode);
  // Also update input field representation
  updateInputDisplay();
});

setupRadioGroup('rg-base', v => {
  const oldBase = inputBase;
  inputBase = v;
  // Convert current input to new base display
  updateInputDisplay();
});

setupRadioGroup('rg-splitbase', v => { splitBase = v; });

// ── Update input field when base changes ──
function updateInputDisplay(){
  if(currentValue === null) return;
  let val = currentValue;
  let mode = bitMode;
  if(mode > 0){
    let mask = (1n << BigInt(mode)) - 1n;
    val = val & mask;
  }
  let text = formatForBase(val, inputBase, mode);
  // Prevent re-trigger
  suppressInput = true;
  calcInput.value = text;
  suppressInput = false;
}

function formatForBase(val, base, mode){
  // For display in the input box
  if(val < 0n && mode === 0){
    // Unlimited mode, negative
    switch(base){
      case 16: return '-' + (-val).toString(16).toUpperCase();
      case 8:  return '-' + (-val).toString(8);
      case 2:  return '-' + (-val).toString(2);
      default: return val.toString(10);
    }
  }
  switch(base){
    case 16: return val.toString(16).toUpperCase();
    case 8:  return val.toString(8);
    case 2:  return val.toString(2);
    default: return val.toString(10);
  }
}

// ── Parse input ──
function parseValue(str, base){
  str = str.trim();
  if(!str) return null;
  // Handle prefixed notation regardless of selected base
  if(/^0x/i.test(str)) return BigInt('0x' + str.slice(2));
  if(/^0o/i.test(str)) return BigInt('0o' + str.slice(2));
  if(/^0b/i.test(str)) return BigInt('0b' + str.slice(2));

  let neg = false;
  if(str.startsWith('-')){ neg = true; str = str.slice(1); }

  let val;
  switch(base){
    case 16: val = BigInt('0x' + str); break;
    case 8:  val = BigInt('0o' + str); break;
    case 2:  val = BigInt('0b' + str); break;
    default: val = BigInt(str); break;
  }
  return neg ? -val : val;
}

// ── Realtime input ──
let suppressInput = false;
calcInput.addEventListener('input', () => {
  if(suppressInput) return;
  const raw = calcInput.value.trim();
  if(!raw){
    currentValue = 0n;
    clearResults('r1');
    return;
  }
  try{
    const val = parseValue(raw, inputBase);
    if(val !== null){
      currentValue = val;
      updateResults('r1', val, bitMode);
    }
  }catch(e){
    // Might be mid-typing or expression — don't clear
  }
});

// ── Enter = Calculate expression ──
calcInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    calculateExpression();
  }
});

function calculateExpression(){
  const raw = calcInput.value.trim();
  if(!raw) return;
  // Check if it looks like an expression (contains operators)
  if(!/[+\-*/%&|^~<>]/.test(raw) && !/<<|>>/.test(raw)){
    return; // Just a plain number, no calculation needed
  }

  const base = inputBase;
  try{
    // Replace number tokens with BigInt literals
    const expr = raw.replace(/\b([0-9a-fA-F]+)\b/g, (match) => {
      // Skip if already prefixed
      if(/^0[xXoObB]/.test(match)) return match + 'n';
      try{
        // Try parsing as current base
        const prefix = {16:'0x',8:'0o',2:'0b'}[base] || '';
        // Validate
        BigInt(prefix + match);
        return prefix + match + 'n';
      }catch(e){
        return match;
      }
    });

    // Add 'n' suffix to prefixed numbers that don't have it
    const expr2 = expr.replace(/\b(0[xX][0-9a-fA-F]+|0[oO][0-7]+|0[bB][01]+)(?!n)\b/g, '$1n');

    // Safe eval — only allow BigInt arithmetic and bitwise
    // Validate: only digits, hex chars, operators, whitespace, n, 0x/0o/0b
    if(/[;(){}\[\]"'`\\$@!?]/.test(expr2)){
      throw new Error('Invalid characters');
    }

    const result = Function('"use strict"; return (' + expr2 + ')')();

    if(typeof result === 'bigint'){
      currentValue = result;
      const resultStr = formatForBase(applyMask(result, bitMode), base, bitMode);
      addHistory(raw + ' = ' + resultStr);
      suppressInput = true;
      calcInput.value = resultStr;
      suppressInput = false;
      updateResults('r1', result, bitMode);
    }
  }catch(e){
    addHistory('Error: ' + raw);
  }
}

function applyMask(val, mode){
  if(mode > 0){
    const mask = (1n << BigInt(mode)) - 1n;
    return val & mask;
  }
  return val;
}

function addHistory(text){
  const line = document.createElement('div');
  line.textContent = text;
  historyEl.appendChild(line);
  historyEl.scrollTop = historyEl.scrollHeight;
}

// ── Result display ──
function updateResults(prefix, val, mode){
  let unsignedVal, signedVal, bits;

  if(mode > 0){
    const mask = (1n << BigInt(mode)) - 1n;
    bits = mode;
    unsignedVal = val & mask;
    // Signed: check MSB
    if(unsignedVal & (1n << BigInt(bits - 1))){
      signedVal = unsignedVal - (1n << BigInt(bits));
    } else {
      signedVal = unsignedVal;
    }
  } else {
    unsignedVal = val;
    signedVal = val;
    bits = 0;
  }

  $('#' + prefix + '-udec').textContent = unsignedVal.toString(10);
  $('#' + prefix + '-sdec').textContent = signedVal.toString(10);

  // HEX
  if(bits > 0){
    const hexLen = bits / 4;
    let h = unsignedVal.toString(16).toUpperCase();
    h = h.padStart(hexLen, '0');
    $('#' + prefix + '-hex').textContent = h;
  } else {
    let h = val < 0n
      ? '-' + (-val).toString(16).toUpperCase()
      : val.toString(16).toUpperCase();
    $('#' + prefix + '-hex').textContent = h;
  }

  // BINARY (4-bit grouped)
  let binStr;
  if(bits > 0){
    binStr = unsignedVal.toString(2).padStart(bits, '0');
  } else {
    binStr = val < 0n ? '-' + (-val).toString(2) : val.toString(2);
  }
  const isNeg = binStr.startsWith('-');
  const rawBits = isNeg ? binStr.slice(1) : binStr;
  const chunks = [];
  for(let i = rawBits.length; i > 0; i -= 4){
    chunks.unshift(rawBits.slice(Math.max(0, i - 4), i));
  }
  let formattedBin = chunks.join(' ');
  if(isNeg) formattedBin = '-' + formattedBin;
  $('#' + prefix + '-bin').textContent = formattedBin;

  // OCTAL
  if(bits > 0){
    $('#' + prefix + '-oct').textContent = unsignedVal.toString(8);
  } else {
    let o = val < 0n
      ? '-' + (-val).toString(8)
      : val.toString(8);
    $('#' + prefix + '-oct').textContent = o;
  }

  // ASCII
  try{
    const target = bits > 0 ? unsignedVal : bigAbs(val);
    let byteLen;
    if(bits > 0){
      byteLen = bits / 8;
    } else {
      byteLen = Math.max(1, Math.ceil(bitLength(target) / 8));
    }
    if(byteLen > 32) byteLen = 32; // safety limit
    let ascii = '';
    for(let i = byteLen - 1; i >= 0; i--){
      const b = Number((target >> BigInt(i * 8)) & 0xFFn);
      ascii += (b >= 0x20 && b <= 0x7E) ? String.fromCharCode(b) : '.';
    }
    $('#' + prefix + '-ascii').textContent = '[' + ascii + ']';
  }catch(e){
    $('#' + prefix + '-ascii').textContent = 'Error';
  }
}

function bitLength(v){
  if(v === 0n) return 1;
  let n = 0;
  let x = v < 0n ? -v : v;
  while(x > 0n){ x >>= 1n; n++; }
  return n;
}

function clearResults(prefix){
  ['udec','sdec','hex','bin','oct','ascii'].forEach(k => {
    $('#' + prefix + '-' + k).textContent = '';
  });
}

// ── Tab 2: 2-Word Combine ──
$('#combineBtn').addEventListener('click', combineTwoWords);
// Also support realtime on input
$('#highWord').addEventListener('input', combineTwoWords);
$('#lowWord').addEventListener('input', combineTwoWords);

function combineTwoWords(){
  const sHigh = $('#highWord').value.trim() || '0';
  const sLow  = $('#lowWord').value.trim()  || '0';
  try{
    let vHigh = parseValue(sHigh, splitBase);
    let vLow  = parseValue(sLow, splitBase);
    if(vHigh === null) vHigh = 0n;
    if(vLow === null)  vLow  = 0n;
    // Mask to 16bit
    vHigh = vHigh & 0xFFFFn;
    vLow  = vLow  & 0xFFFFn;
    const combined = (vHigh << 16n) | vLow;
    updateResults('r2', combined, 32); // Always DWORD
  }catch(e){
    clearResults('r2');
  }
}

// ── Service Worker Registration ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

})();
</script>
